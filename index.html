    <style>
      body { background: #fbeaf0; margin: 0; }

  <body>
    <div id="root">
      <div id="app-loader" style="
        position: fixed;
        inset: 0;
        background: #fbeaf0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'DM Sans', sans-serif;
      ">
        <div style="
          font-family: 'Playfair Display', Georgia, serif;
          font-size: 32px;
          font-weight: 700;
          color: #d4537e;
          margin-bottom: 24px;
        ">Bag<span style="color: #1a1a1a;">Style</span></div>

        <div style="
          width: 36px;
          height: 36px;
          border: 3px solid #f0c0d0;
          border-top-color: #d4537e;
          border-radius: 50%;
          animation: spin 0.7s linear infinite;
        "></div>

        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
